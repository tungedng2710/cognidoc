server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve service names through Docker DNS for every request window. Without
    # this, Nginx keeps the API container IP that existed when Nginx started and
    # returns 502 after Compose recreates the API with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    location /api/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://$api_upstream/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
